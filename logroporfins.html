<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Logros y reconocimientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--au:#d4af37;--au2:#f6e27a;--au3:#8a6a12;--tx:#f5e7c0}
*{box-sizing:border-box}
body{margin:0;padding-top:56px;color:var(--tx);font:15px/1.4 Poppins,"Segoe UI",system-ui,Arial,sans-serif;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#4a3508 0,#1a1408 38%,#060504 100%) fixed}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle,#f6e27a 1.5px,transparent 2.5px),radial-gradient(circle,#fff 1px,transparent 2px);background-size:150px 150px,220px 220px;background-position:20px 30px,90px 110px;animation:tw 4s ease-in-out infinite alternate}@keyframes tw{from{opacity:.2}to{opacity:.8}}
button,input,textarea,select{font:inherit}
#app{max-width:1100px;margin:0 auto;padding:22px 18px 150px}
.bn{position:fixed;top:0;left:0;right:0;z-index:70;background:linear-gradient(180deg,#1a140a,#000);color:var(--au2);font:700 16px Playfair Display,serif;letter-spacing:3px;padding:10px 12px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 12px;border-bottom:2px solid var(--au);box-shadow:0 4px 16px rgba(0,0,0,.6)}
.bl{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;gap:8px}.bt2{text-align:center}
.vb{background:linear-gradient(180deg,var(--au2),var(--au));color:#2a1d00;text-decoration:none;font:800 13px Poppins,sans-serif;letter-spacing:.3px;padding:6px 14px;border:0;border-radius:20px;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 var(--au3)}
.crown{display:block;margin:6px auto 0;width:74px;height:auto}
h1{margin:6px 0 4px;text-align:center;font:700 clamp(30px,7vw,54px)/1.1 Playfair Display,serif;background:linear-gradient(180deg,#fff7c9,#d4af37 55%,#8a6a12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
.sub{text-align:center;color:#e9d9a6;margin:0 0 26px;font:italic 500 18px Playfair Display,serif;letter-spacing:.5px}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:640px;margin:0 auto}
.sd{display:flex;align-items:center;gap:14px;border:2px solid var(--au);border-radius:18px;padding:22px 18px;color:var(--au2);cursor:pointer;text-align:left;background:linear-gradient(145deg,#241a08,#0a0805);box-shadow:0 8px 22px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,235,150,.15);transition:.2s;font:700 18px Playfair Display,serif}
.sd:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(212,175,55,.35),inset 0 0 0 1px rgba(255,235,150,.3)}
.sd i{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#d4af37 60%,#8a6a12);display:grid;place-items:center;flex:none}
.sd small{display:block;font:600 12px Poppins,sans-serif;opacity:.75;letter-spacing:1px;text-transform:uppercase}
.bt{border:0;border-radius:14px;padding:9px 16px;font-weight:700;color:#2a1d00;background:linear-gradient(180deg,var(--au2),var(--au));cursor:pointer;box-shadow:0 3px 0 var(--au3)}
.bt.w{background:#14100a;color:var(--au2);border:2px solid var(--au3);box-shadow:none}.bt.r{background:#b91c1c;color:#fff;box-shadow:0 3px 0 #7f1d1d}.bt:disabled{opacity:.6;cursor:wait}
.tb{display:flex;flex-direction:column;align-items:center;gap:14px;margin:6px 0 20px}
.chip{border-radius:22px;padding:7px 22px;font:700 20px Playfair Display,serif;color:var(--au2);border:2px solid var(--au);background:rgba(0,0,0,.45)}
.cta{display:flex;align-items:center;gap:14px;border:0;border-radius:40px;padding:14px 30px 14px 16px;cursor:pointer;color:#2a1d00;font:700 22px/1.1 Playfair Display,serif;text-align:left;background:linear-gradient(135deg,#fff3b0,#f6c944 50%,#c9961a);box-shadow:0 7px 0 #7a5a06,0 14px 26px rgba(212,175,55,.4);animation:pul 2.2s ease-in-out infinite;transition:transform .15s}
.cta small{display:block;font:600 12px Poppins,sans-serif;opacity:.8;margin-top:3px}
.cta .pen{width:52px;height:52px;border-radius:50%;background:#2a1d00;display:grid;place-items:center;flex:none}
.cta:hover{transform:translateY(-3px) scale(1.03)}.cta:active{transform:translateY(3px)}
@keyframes pul{0%,100%{box-shadow:0 7px 0 #7a5a06,0 14px 26px rgba(212,175,55,.4)}50%{box-shadow:0 7px 0 #7a5a06,0 14px 46px rgba(246,226,122,.9)}}
.mbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(0,0,0,.5);border:2px dashed var(--au);border-radius:14px;padding:8px 14px;margin-bottom:18px;font-weight:700;font-size:13px;color:var(--au2)}.mbar .sp{flex:1}
.mbtn{position:fixed;right:16px;bottom:16px;z-index:60;border:2px solid var(--au);border-radius:24px;padding:10px 18px;background:#0a0805;color:var(--au2);font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.mus{position:fixed;left:16px;bottom:16px;z-index:60;border:2px solid var(--au);border-radius:24px;padding:10px 16px;background:#0a0805;color:var(--au2);font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;margin:6px 0 14px}
.ctl select,.ctl input{border:2px solid var(--au3);border-radius:20px;padding:7px 14px;background:#0f0b05;color:var(--tx);font-size:13px}.ctl input{width:190px}
#cnt{color:var(--au2);font-weight:700;margin-bottom:12px}
.wall{column-count:3;column-gap:24px;padding-top:12px}
.pl{position:relative;break-inside:avoid;margin:0 0 28px;padding:12px;border-radius:8px;cursor:pointer;background:linear-gradient(135deg,#f7dc72,#b8860b 26%,#fbe48f 50%,#a8780a 74%,#f3d36a);box-shadow:0 10px 22px rgba(0,0,0,.6),inset 0 0 0 2px #7a5a06;transition:.2s}
.pl:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 16px 30px rgba(212,175,55,.4),inset 0 0 0 2px #7a5a06}
.pl:before{content:'';position:absolute;top:-14px;left:50%;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f59e0b 60%,#b45309);box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 0 0 3px #fde68a;z-index:1}
.ph{background:#e8e2d0;min-height:110px;display:grid;place-items:center;overflow:hidden;border:4px solid #fffaf0;border-radius:3px}.ph img{display:block;width:100%;height:auto}.ph.bad:after{content:'Imagen no disponible';color:#6b6350;font-size:13px;padding:34px 10px}
.cap{background:#fffaf0;color:#2a1d00;padding:10px 12px 9px;border-radius:0 0 4px 4px;font:italic 500 16px/1.3 Playfair Display,serif}.cap p{margin:0;white-space:pre-wrap;word-wrap:break-word}.cap small{display:block;margin-top:6px;font:700 12px Poppins,sans-serif;color:#8a6a12;font-style:normal}
.dl{position:absolute;top:2px;right:2px;z-index:3;display:grid;place-items:center;padding:0;border:0;background:#b91c1c;color:#fff;border-radius:50%;width:30px;height:30px;cursor:pointer}
.st,.emp,.nr{background:rgba(0,0,0,.55);border:2px solid var(--au3);border-radius:18px;padding:26px;text-align:center;font-weight:600;max-width:520px;margin:20px auto;color:var(--tx)}
.ld:after{content:'...';animation:dt 1.2s steps(4) infinite}@keyframes dt{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.md{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:14px}
.mc{position:relative;background:linear-gradient(160deg,#1c1508,#0c0905);color:var(--tx);border:2px solid var(--au);border-radius:20px;padding:22px 20px 18px;width:100%;max-width:460px;max-height:90vh;overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.7),0 0 30px rgba(212,175,55,.2)}.mc.wd{max-width:640px}
.mc h3{margin:0 0 10px;padding-right:40px;font:700 22px Playfair Display,serif;color:var(--au2)}.mc label{display:block;font-weight:700;font-size:13px;margin-top:12px;color:#d9c27a}
.mc input,.mc textarea,.mc select{width:100%;margin-top:4px;padding:10px 12px;border:2px solid #5a4510;border-radius:12px;color:#fff1c2;background:#0b0906}.mc textarea{min-height:80px;resize:vertical}
.mc .x{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border:2px solid var(--au3);border-radius:50%;background:#0b0906;color:var(--au2);display:grid;place-items:center;cursor:pointer}.mc .x:hover{background:#b91c1c;color:#fff;border-color:#b91c1c}
.ds{color:#cdb878;margin:6px 0}.ms{min-height:20px;margin-top:10px;font-weight:700;font-size:13px;color:#ff9d9d}.ms.ld{color:#cdb878}
.fx{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.pw,.lk{display:flex;gap:6px;align-items:center}.pw input,.lk input{flex:1;min-width:0}.pw button{border:2px solid var(--au3);background:#14100a;color:var(--au2);border-radius:10px;padding:8px 12px;cursor:pointer;margin-top:4px;font-weight:700}
.lk .bt{white-space:nowrap;text-decoration:none;display:inline-block;margin-top:4px;padding:10px 14px}
.pv{display:none;margin-top:8px}.pv img{max-width:100%;max-height:180px;border-radius:8px}
.big{width:100%;border-radius:8px;display:block;margin-top:10px;border:3px solid var(--au)}
@media(max-width:900px){.bl{position:static;transform:none;width:100%;justify-content:flex-start}.bt2{width:100%}.wall{column-count:2}.ctl{justify-content:stretch}.ctl input{width:100%}.ctl div{flex:1}}
@media(max-width:600px){.wall{column-count:1}.sg{grid-template-columns:1fr}.cta{width:100%}.bn{font-size:13px;letter-spacing:1.5px}}
</style></head><body>
<div class="bn"><div class="bl"><a id="cl" class="vb" href="https://capacitacion3vesmartin-ves.github.io/campuscapacitacion/">← Volver al campus</a><button id="bk" class="vb" data-a="cambiar" style="display:none">← Cambiar de sede</button></div><span class="bt2">LOGROS Y RECONOCIMIENTOS</span></div>
<div id="app"></div>
<button id="mus" class="mus" data-a="mus">Música</button>
<button id="mbtn" class="mbtn" data-a="master">Master</button>
<div id="md" class="md"></div>
<script>
/* Pega aquí la URL del Apps Script de LOGROS (termina en /exec). */
const URL_API='https://script.google.com/macros/s/AKfycbzunTa15ooiVspf1nY__lzfqssEhuYDchYNHfD1HZWlCu6nXZrcZDt6cerc2Al2ZHyc/exec';
const SEDES=['Villa el Salvador','Puente Piedra','Arequipa','Piura'];
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okUrl=u=>/^https?:\/\//i.test(String(u||'').trim());
const nrm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fchip(d){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?(+m[3])+' '+MESC[+m[2]-1]+' '+m[1]:''}
let SEDE=null,ITEMS=[],ST='idle',TKU='',TKM='',ORD='rec',Q='';
const MASTER=()=>!!TKM,TK=()=>TKM||TKU;
function guardar(){try{sessionStorage.setItem('lg',JSON.stringify({s:SEDE,u:TKU,m:TKM}))}catch(e){}}
try{const o=JSON.parse(sessionStorage.getItem('lg')||'{}');if(o.s&&(o.u||o.m)){SEDE=o.s;TKU=o.u||'';TKM=o.m||''}}catch(e){}
const IS='width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const TRS='<svg viewBox="0 0 24 24" '+IS+'><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';
const TRO=c=>'<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3"/></svg>';
const CRN='<svg class="crown" viewBox="0 0 64 44" fill="none" stroke="#f6e27a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M6 36L2 10l16 14L32 4l14 20L62 10l-4 26z" fill="rgba(212,175,55,.25)"/><path d="M8 40h48"/></svg>';
const MSV='<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="vertical-align:-3px;margin-right:4px"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V7h6V3z"/></svg>';
const X='<button class="x" data-a="cerrar" aria-label="Cerrar"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg></button>';
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);

async function api(p){
 if(!URL_API||URL_API.startsWith('PEGA'))throw new Error('Falta conectar la base de datos (URL del Apps Script).');
 let j;try{const r=await fetch(URL_API,{method:'POST',body:JSON.stringify(p)});j=await r.json()}catch(e){throw new Error('No hay conexión con el servidor. Intenta de nuevo.')}
 if(!j.ok){if(j.codigo=='SESION')salirTodo(true);throw new Error(j.error||'Error del servidor')}
 return j}
function modal(h,wide){const m=$('#md');m.innerHTML='<div class="mc'+(wide?' wd':'')+'">'+h+'</div>';m.style.display='flex'}
function cerrar(){$('#md').style.display='none';$('#md').innerHTML=''}
function msg(t,ld){const m=$('#mm');if(m){m.textContent=t;m.className='ms'+(ld?' ld':'')}}
const busy=b=>document.querySelectorAll('#md .fx .bt').forEach(x=>x.disabled=b);
const ojo='<button type="button" data-a="ojo">Ver</button>';
function ajb(){const b=$('.bn');if(b)document.body.style.paddingTop=(b.offsetHeight+10)+'px'}
addEventListener('resize',ajb);addEventListener('load',ajb);

/* ===== Pantallas ===== */
function ts(x){const m=/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/.exec(x.fecha||'');if(m)return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)).getTime();const d=Date.parse(x.fecha);return isNaN(d)?0:d}
function lista(){const q=nrm(Q);return ITEMS.filter(x=>!q||nrm([x.descripcion,fchip(x.fecha_logro)].join(' ')).includes(q)).sort((a,b)=>ORD=='rec'?ts(b)-ts(a):ts(a)-ts(b))}
function nota(x){const h=hash(x.id),fd=fchip(x.fecha_logro);
 return '<div class="pl" data-a="ver" data-id="'+E(x.id)+'">'
 +(MASTER()?'<button class="dl" data-a="borrar" data-id="'+E(x.id)+'" title="Borrar">'+TRS+'</button>':'')
 +'<div class="ph"><img src="'+E(x.foto)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add(\'bad\');this.remove()"></div>'
 +((x.descripcion||fd)?'<div class="cap">'+(x.descripcion?'<p>'+E(x.descripcion)+'</p>':'')+(fd?'<small>'+E(fd)+'</small>':'')+'</div>':'')+'</div>'}
function pintaMuro(){const L=lista(),w=$('#wall');if(!w)return;
 $('#cnt').textContent=L.length+(L.length==1?' logro':' logros');w.className=L.length?'wall':'';
 w.innerHTML=L.length?L.map(nota).join(''):'<div class="nr">'+(ITEMS.length?'No se encontraron logros con esa búsqueda.':'Aún no hay logros publicados en esta sede.')+'</div>'}
function R(){const a=$('#app'),mb=$('#mbtn');mb.style.display=MASTER()?'none':'block';let h='';
 if(!SEDE){h=CRN+'<h1>Logros y reconocimientos</h1><p class="sub">Celebramos a quienes hacen grande a Martin</p><div class="sg">'
  +SEDES.map(s=>'<button class="sd" data-a="sede" data-v="'+E(s)+'"><i>'+TRO('#2a1d00')+'</i><span>'+E(s)+'<small>Sede</small></span></button>').join('')+'</div>'}
 else{h=CRN+'<h1>Logros y reconocimientos</h1><div class="tb"><span class="chip">'+E(SEDE)+'</span>'
  +(MASTER()?'<button class="cta" data-a="subir"><span class="pen">'+TRO('#f6e27a')+'</span><span>Subir un logro<small>Foto y descripción del reconocimiento</small></span></button>':'')+'</div>'
  +(MASTER()?'<div class="mbar">Modo master · '+E(SEDE)+'<span class="sp"></span><button class="bt w" data-a="salir">Salir de master</button></div>':'');
  if(ST=='load')h+='<div class="st ld">Cargando logros</div>';
  else if(ST=='err')h+='<div class="st">No se pudieron cargar los logros.<br><br><button class="bt" data-a="reint">Reintentar</button></div>';
  else h+='<div class="ctl"><select id="ord"><option value="rec"'+(ORD=='rec'?' selected':'')+'>Más recientes</option><option value="ant"'+(ORD=='ant'?' selected':'')+'>Más antiguos</option></select><div><input id="q" type="search" placeholder="Buscar logro…" value="'+E(Q)+'" autocomplete="off"></div></div><div id="cnt"></div><div id="wall"></div>'}
 $('#cl').style.display=SEDE?'none':'';$('#bk').style.display=SEDE?'':'none';
 a.innerHTML=h;pintaMuro();ajb()}
async function cargar(sil){if(!sil){ST='load';R()}
 try{const j=await api({accion:'listar',token:TK()});ITEMS=j.items||[];ST='ok'}catch(e){ST='err';if(sil)alert(e.message)}R()}

/* ===== Acceso por sede (usuario) ===== */
function pedirClave(sede){modal(X+'<h3>'+E(sede)+'</h3><p class="ds">Escribe la clave de tu sede para ver sus logros.</p><label>Clave<div class="pw"><input id="cp" type="password" autocomplete="new-password" placeholder="Clave">'+ojo+'</div></label><div id="mm" class="ms"></div><div class="fx"><button class="bt w" data-a="cerrar">Cancelar</button><button class="bt" data-a="entrar" data-v="'+E(sede)+'">Entrar</button></div>');setTimeout(()=>{const i=$('#cp');if(i)i.focus()},50)}
async function entrar(sede){const v=$('#cp').value;if(!v){msg('Escribe la clave.');return}msg('Confirmando',true);busy(true);
 try{const j=await api({accion:'entrar',sede:sede,clave:v});TKU=j.token;TKM='';SEDE=sede;ITEMS=[];Q='';guardar();cerrar();cargar()}
 catch(e){busy(false);msg(e.message);const i=$('#cp');if(i)i.select()}}

/* ===== Master ===== */
function loginM(){modal(X+'<h3>Acceso master</h3><label>Tu sede<select id="msd"><option value="">Elige tu sede…</option>'+SEDES.map(s=>'<option>'+E(s)+'</option>').join('')+'</select></label><label>Clave master<div class="pw"><input id="cp" type="password" autocomplete="new-password" placeholder="Clave">'+ojo+'</div></label><div id="mm" class="ms"></div><div class="fx"><button class="bt w" data-a="cerrar">Cancelar</button><button class="bt" data-a="entrarm">Ingresar</button></div>')}
async function entrarM(){const s=$('#msd').value,v=$('#cp').value;if(!s){msg('Elige tu sede.');return}if(!v){msg('Escribe la clave.');return}msg('Confirmando credenciales',true);busy(true);
 try{const j=await api({accion:'login_master',sede:s,clave:v});TKM=j.token;TKU='';SEDE=s;ITEMS=[];Q='';guardar();cerrar();cargar()}
 catch(e){busy(false);msg(e.message)}}
function salirTodo(sil){const t=[TKM,TKU].filter(Boolean);t.forEach(k=>api({accion:'logout',token:k}).catch(()=>{}));TKM='';TKU='';SEDE=null;ITEMS=[];ST='idle';Q='';guardar();cerrar();R();if(sil===true)alert('Tu sesión venció. Ingresa de nuevo.')}

function prev(){const i=$('#ff'),v=$('#fv');if(!i||!v)return;const u=i.value.trim();if(okUrl(u)){v.style.display='block';v.innerHTML='<img src="'+E(u)+'" alt="Vista previa" referrerpolicy="no-referrer" onerror="this.parentNode.style.display=\'none\'">'}else{v.style.display='none';v.innerHTML=''}}
function subir(){modal(X+'<h3>Subir un logro</h3><p class="ds">Se publicará de inmediato en <b>'+E(SEDE)+'</b>.</p>'
 +'<label>Enlace de la foto<div class="lk"><input id="ff" placeholder="https://..."><a class="bt" href="https://www.image2url.com/es/dashboard" target="_blank" rel="noopener">Subir foto</a></div></label>'
 +'<p class="ds" style="font-size:12.5px">1) Pulsa «Subir foto» y sube tu imagen. 2) Copia el enlace que te dan. 3) Pégalo aquí.</p><div id="fv" class="pv"></div>'
 +'<label>Descripción del logro<textarea id="fds" maxlength="300" placeholder="Ej. Asesora del mes por su excelente servicio"></textarea></label>'
 +'<label>Fecha del logro (opcional)<input id="fd" type="date"></label><div id="mm" class="ms"></div>'
 +'<div class="fx"><button class="bt w" data-a="cerrar">Cancelar</button><button class="bt" data-a="publicar">Publicar logro</button></div>',true)}
async function publicar(){const f=$('#ff').value.trim(),d=$('#fds').value.trim(),dt=$('#fd').value;
 if(!f){msg('Pega el enlace de la foto.');return}if(!okUrl(f)){msg('El enlace debe empezar con http:// o https://');return}
 msg('Publicando',true);busy(true);

/* ===== Música de piano suave (sintetizada, sin archivos) ===== */
const CH=[[293.66,369.99,440,587.33,440,369.99,293.66,369.99],[220,277.18,329.63,440,329.63,277.18,220,277.18],[246.94,293.66,369.99,493.88,369.99,293.66,246.94,293.66],[196,246.94,293.66,392,493.88,392,293.66,246.94]];
const PD=[[146.83,220,293.66,369.99],[110,164.81,220,277.18],[123.47,185,246.94,293.66],[98,146.83,196,246.94]];
const ML=[[587.33,739.99,880],[554.37,659.25,880],[587.33,739.99,987.77],[587.33,783.99,987.77]];
let AC=null,OUT=null,NT=0,ST2=0,TM=null,MON=false,MOFF=false;
try{MOFF=localStorage.getItem('lg_mus')=='off'}catch(e){}
function pno(f,t,d,v){const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),g2=AC.createGain();o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2;g2.gain.value=.18;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);o2.connect(g2);g2.connect(g);g.connect(OUT);o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1)}
function pad(f,t,d,v){const o=AC.createOscillator(),o2=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o2.type='sawtooth';o.frequency.value=f;o2.frequency.value=f;o2.detune.value=7;fl.type='lowpass';fl.frequency.value=1100;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.3);g.gain.setValueAtTime(v,t+d-.9);g.gain.linearRampToValueAtTime(.0001,t+d);
 o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(OUT);o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1)}
function sched(){while(NT<AC.currentTime+1.2){const k=Math.floor(ST2/8)%4,i=ST2%8,c=CH[k];
  pno(c[i],NT,1.6,.09);
  if(i==0){PD[k].forEach(f=>pad(f,NT,4.2,.035));pno(PD[k][0]/2,NT,3,.12)}
  if(i==0||i==3||i==5)pno(ML[k][i==0?0:i==3?1:2],NT+.02,2.2,.1);
  NT+=.5;ST2++}}
function startMus(){if(MOFF||MON)return;try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const m=AC.createGain();m.gain.value=.7;m.connect(AC.destination);
  const cv=AC.createConvolver(),n=AC.sampleRate*2.8,b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)}
  cv.buffer=b;const w=AC.createGain();w.gain.value=.55;OUT=AC.createGain();OUT.connect(m);OUT.connect(cv);cv.connect(w);w.connect(m);NT=AC.currentTime+.2}
 AC.resume();MON=true;if(!TM)TM=setInterval(sched,250);musUi()}catch(e){}}
function stopMus(){MON=false;if(AC)AC.suspend();musUi()}
function musUi(){$('#mus').innerHTML=MSV+(MON?'Música: ON':'Música: OFF')}
function toggleMus(){if(MON){MOFF=true;stopMus()}else{MOFF=false;startMus()}try{localStorage.setItem('lg_mus',MOFF?'off':'on')}catch(e){}}
document.addEventListener('click',function f(){startMus();document.removeEventListener('click',f)},{once:true});
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else if(MON)AC.resume()});
musUi();

if(SEDE&&TK())cargar();else{SEDE=null;R()}
